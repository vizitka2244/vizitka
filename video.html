<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a1424">
  <title>Video · Lovro Horvat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#0a1424;--surface:#101f38;--surface-2:#132743;
      --azure:#1877d2;--azure-soft:#3a95ee;--gold:#c9a24c;--gold-soft:#e6cd8a;
      --text:#eaf0f8;--muted:#9fb0c6;--line:rgba(120,160,210,.14);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Inter',system-ui,sans-serif;color:var(--text);
      min-height:100vh;min-height:100dvh;background:var(--navy);
      padding:max(20px,env(safe-area-inset-top)) 14px 48px;overflow-x:hidden;position:relative;
    }
    body::before{
      content:'';position:fixed;inset:-20% -10% auto -10%;height:60vh;z-index:0;pointer-events:none;
      background:radial-gradient(60% 100% at 30% 0%,rgba(24,119,210,.4),transparent 70%),
                 radial-gradient(50% 80% at 90% 10%,rgba(201,162,76,.16),transparent 70%);
      filter:blur(30px);
    }
    .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto}
    .back{
      display:inline-flex;align-items:center;gap:7px;color:var(--muted);
      text-decoration:none;font-size:.88rem;font-weight:500;margin-bottom:22px;padding:8px 0;
      transition:color .2s ease,gap .2s ease;
    }
    .back:hover{color:var(--gold-soft);gap:11px}
    .back svg{width:18px;height:18px}
    .eyebrow{
      font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
      color:var(--gold);margin-bottom:8px;
    }
    h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.9rem;letter-spacing:-.01em;line-height:1.1}
    .sub{font-size:.86rem;color:var(--muted);margin:4px 0 26px}
    .sub b{color:var(--gold-soft);font-weight:500}

    .stage{
      position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;
      background:linear-gradient(150deg,var(--surface-2),var(--surface));
      border:1px solid var(--line);
      box-shadow:0 26px 50px -22px rgba(0,0,0,.7);
      display:flex;align-items:center;justify-content:center;
      animation:rise .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .stage::after{
      content:'';position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(70% 70% at 50% 45%,rgba(24,119,210,.18),transparent 70%);
    }
    .play{
      position:relative;z-index:2;width:82px;height:82px;border-radius:50%;
      background:linear-gradient(135deg,var(--gold-soft),var(--gold));
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 14px 34px -8px rgba(201,162,76,.6);
    }
    .play svg{width:34px;height:34px;color:#0a1424;margin-left:4px}
    .play::before{
      content:'';position:absolute;inset:0;border-radius:50%;
      border:2px solid rgba(230,205,138,.5);
      animation:pulse 2.4s ease-out infinite;
    }
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
    .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

    .cap{
      margin-top:16px;padding:14px 16px;border-radius:14px;
      background:rgba(24,119,210,.08);border:1px solid var(--line);
      font-size:.78rem;color:var(--muted);line-height:1.6;text-align:center;
    }
    .cap code{
      display:block;margin-top:8px;font-size:.72rem;color:var(--gold-soft);
      background:rgba(0,0,0,.3);padding:8px 10px;border-radius:8px;word-break:break-all;
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="lovro-horvat-vizitka.html" class="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      Natrag na vizitku
    </a>

    <p class="eyebrow">Video</p>
    <h1>Prezentacija</h1>
    <p class="sub">Lovro Horvat · <b>mag. polit.</b></p>

    <!-- Zamijeni .play blok s iframe-om kad imaš video ID:
         <iframe src="https://www.youtube.com/embed/VIDEO_ID" title="Lovro Horvat"
           allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
           allowfullscreen></iframe> -->
    <div class="stage">
      <div class="play">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>

    <p class="cap">
      Ubaci YouTube / Vimeo video – zamijeni blok <b>.play</b> s iframe-om:
      <code>&lt;iframe src="https://www.youtube.com/embed/VIDEO_ID" allowfullscreen&gt;&lt;/iframe&gt;</code>
    </p>
  </div>
</body>
</html>
