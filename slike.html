<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070f1f">
  <title>Galerija slika · Lovro Horvat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#070f1f;
      --blue:#1e7fe0;
      --blue-bright:#3aa0ff;
      --cyan:#63c8ff;
      --text:#eef4fb;
      --muted:#9db3cd;
      --glass:rgba(9,17,35,.30);
      --glass-hi:rgba(28,55,98,.44);
      --stroke:rgba(150,190,240,.18);
      --stroke-hi:rgba(90,170,255,.6);
      --font-d:'Saira',system-ui,sans-serif;
      --font-b:'Inter',system-ui,sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      font-family:var(--font-b);color:var(--text);
      min-height:100vh;min-height:100dvh;
      background:
        radial-gradient(70% 50% at 50% 0%,rgba(30,127,224,.18),transparent 70%),
        var(--bg);
      display:flex;justify-content:center;align-items:flex-start;
      padding:max(20px,env(safe-area-inset-top)) 14px 48px;
      line-height:1.5;overflow-x:hidden;
    }

    .card{
      position:relative;z-index:1;width:100%;max-width:440px;
      border:1px solid var(--stroke);border-radius:26px;overflow:hidden;
      background:
        linear-gradient(180deg,rgba(6,14,30,.14) 0%,rgba(6,14,30,.2) 42%,rgba(6,14,30,.42) 100%),
        url('pozadina.jpg') left top / cover no-repeat;
      box-shadow:0 30px 60px -22px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.04) inset;
      animation:rise .7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
    .card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;z-index:4;
      background:linear-gradient(90deg,transparent,var(--cyan),var(--blue-bright),var(--cyan),transparent);
      box-shadow:0 0 14px rgba(58,160,255,.7);
    }

    .header{position:relative;padding:26px 22px 18px;text-align:center}
    
    .back-btn{
      display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;
      background:var(--glass);border:1px solid var(--stroke);color:var(--cyan);
      text-decoration:none;font-family:var(--font-d);font-size:.82rem;font-weight:600;
      letter-spacing:.04em;text-transform:uppercase;margin-bottom:16px;
      transition:transform .2s ease,border-color .2s ease,background .2s ease;
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    }
    .back-btn:hover{transform:translateX(-3px);border-color:var(--stroke-hi);background:var(--glass-hi)}
    .back-btn svg{width:16px;height:16px}

    .title{font-family:var(--font-d);font-weight:700;font-size:1.75rem;letter-spacing:.01em;line-height:1.1;text-shadow:0 2px 18px rgba(0,0,0,.5)}
    .subtitle{font-family:var(--font-d);font-weight:500;font-size:.9rem;color:var(--cyan);letter-spacing:.06em;margin-top:3px}

    .body{padding:10px 18px 24px}
    
    .gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    .photo-cell{
      position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;
      background:var(--glass);border:1px solid var(--stroke);cursor:pointer;
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
      transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
    }
    .photo-cell:hover{transform:translateY(-3px);border-color:var(--stroke-hi);box-shadow:0 12px 24px -10px rgba(58,160,255,.5)}
    .photo-cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
    .photo-cell:hover img{transform:scale(1.06)}

    .stagger{opacity:0;transform:translateY(12px);animation:up .55s cubic-bezier(.22,1,.36,1) forwards}
    .d1{animation-delay:.08s}.d2{animation-delay:.15s}.d3{animation-delay:.22s}.d4{animation-delay:.29s}
    @keyframes up{to{opacity:1;transform:none}}

    .footer{
      text-align:center;padding:16px 18px 12px;font-size:.68rem;color:var(--muted);
      letter-spacing:.08em;border-top:1px solid rgba(150,190,240,.12);
    }
    .footer b{font-family:var(--font-d);color:var(--cyan);font-weight:600}

    /* Lightbox modal */
    .lightbox{
      position:fixed;inset:0;z-index:50;display:none;place-items:center;
      background:rgba(5,10,22,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
      padding:20px;opacity:0;transition:opacity .25s ease;
    }
    .lightbox.active{display:grid;opacity:1}
    .lightbox img{
      max-width:100%;max-height:80vh;border-radius:18px;
      box-shadow:0 24px 50px -15px rgba(0,0,0,.9);
      border:1px solid var(--stroke-hi);
      animation:pop .28s cubic-bezier(.22,1,.36,1);
    }
    @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
    .close-btn{
      position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;
      background:var(--glass);border:1px solid var(--stroke-hi);color:#fff;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
    }
    .close-btn svg{width:20px;height:20px}
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span>Vizitka</span>
      </a>
      <h1 class="title">Galerija slika</h1>
      <p class="subtitle">Lovro Horvat · mag. polit.</p>
    </header>

    <div class="body">
      <div class="gallery-grid" id="gallery">
        <div class="photo-cell stagger d1"><img src="lovro-horvat.jpg" alt="Lovro Horvat"></div>
        <!-- Dodaj nove slike ovdje kopiranjem linije ispod -->
        <div class="photo-cell stagger d2"><img src="lovro-horvat.jpg" alt="Lovro Horvat"></div>
        <div class="photo-cell stagger d3"><img src="lovro-horvat.jpg" alt="Lovro Horvat"></div>
        <div class="photo-cell stagger d4"><img src="lovro-horvat.jpg" alt="Lovro Horvat"></div>
      </div>
    </div>

    <footer class="footer">Digitalna vizitka · <b>Lovro Horvat</b></footer>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="close-btn" id="lbClose" aria-label="Zatvori"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    <img id="lbImg" src="" alt="">
  </div>

  <script>
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    
    document.getElementById('gallery').addEventListener('click', e => {
      const img = e.target.closest('.photo-cell img');
      if(!img) return;
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lb.classList.add('active');
    });

    function closeLB() { lb.classList.remove('active'); }
    document.getElementById('lbClose').addEventListener('click', closeLB);
    lb.addEventListener('click', e => { if(e.target === lb) closeLB(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLB(); });
  </script>
</body>
</html>
